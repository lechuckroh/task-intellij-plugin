# https://taskfile.dev

version: '3'

vars:
  TEST: test

tasks:
  default:
    cmds:
      - task --list-all

  build:
    cmds:
      - ./gradlew build

  format:
    cmds:
      - ./gradlew ktfmtFormat

  runIde:
    cmds:
      - ./gradlew runIde

  print:
    cmds:
      - cat Taskfile.yml
      - echo TEST={{.TEST}} TEST2={{.TEST2}}
