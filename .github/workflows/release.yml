on:
  push:
    branches:
      - "!*"
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # default scope omits jdks; without it foojay re-downloads the 17 toolchain every run
          gradle-home-cache-includes: |
            caches
            notifications
            jdks

      - name: Build
        run: ./gradlew clean build

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/distributions/*.zip
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          body: |
            Release ${{ env.RELEASE_VERSION }}
            Install : Preferences -> Plugin -> Install Plugin from Disk

      - name: Publish plugin
        run: ./gradlew publishPlugin
        env:
          ORG_GRADLE_PROJECT_intellijPublishToken: ${{ secrets.PUBLISH_TOKEN }}
